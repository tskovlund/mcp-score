name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: tskovlund/.github/.github/workflows/python-ci.yml@5bb0d20b76da99a9a20c0beb03229d2a56d83fb0 # main
    with:
      python-version: "3.14"
